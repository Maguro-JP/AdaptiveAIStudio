# テストを回す。
#
# Windows を入れているのが要点。
# 「Linux では通るが Windows では落ちる」が実際に起きており
# （殻の glob 展開、巨大な仮ファイル、パスの区切り、実行ビット）、
# 手元が Windows でも、直す側が Linux なら気づけない。
#
# ただし **Windows の枠は2倍で数えられる**。前に使い切って
# 1日まるごと確かめられなくなった。
#
# **push では回さない。** ここが一番効く。
# 直しを10回押せば10回回る、という作りだったのが元凶で、
# 1回あたりを安くしても、回数が減らなければ意味がない。
#
# 代わりに、回すのは次の三つだけ。
#
#   PR を出したとき   人に見せる前。ここが本来のテストの場
#   手で頼んだとき    確かめたいときに、確かめたいものを
#   週に一度          網。手元では気づけない環境側の変化を拾う
#                     （ランナーの中身や Node の更新で、こちらを
#                       変えていなくても落ちることがある）
#
# main へ直接押す運用では、押す前に手元で npm test を通す。
# 手元と CI で違いが出るのは Windows なので、そこが気になる変更のときは
# PR を出すか、手で回す。
#
# 1回あたりも減らしてある。
#   ・後から押したら、走っている前のものは打ち切る
#   ・組み合わせは2つだけ（下限の Node は Linux、Windows は現行の Node）
#   ・型チェックは独立した仕事にしない（仕事を1つ増やすと、それだけで1分課金される）
#   ・文書だけの変更では回さない
name: CI

on:
  pull_request:
    # **Ready にした時点も合図にする。**既定（開いた・押した・開き直した）だけだと、
    # draft の間に止めておいた Windows が、Ready にしても回らない。
    types: [opened, synchronize, reopened, ready_for_review]
    # `.claude/**` は Claude Code の作業の決まり（スキル・フック・権限）。製品のコードもテストも
    # ここを読まないので、ここだけの変更では `npm test` の結果が変わらない（スキルの更新の PR で起きていた）。
    # 並びは `scripts/docs-only-push.mjs` の DOCS と同じ（`test/docs-only-push.test.ts` が突き合わせる）。
    paths-ignore: ['**.md', 'docs/**', '.gitignore', '.gitattributes', '.claude/**']
  schedule:
    # 毎週月曜 09:00 JST。UTC では月曜 00:00。
    # （JST の何時かを先に決めてから UTC へ直す。逆をやると1日ずれる）
    # **1回あたり 46 分ぶん（課金）。月に 184 分ほど。**
    # 実測（run 35557577310、2026-09-21）:
    #   ubuntu / Node 22.x       3分41秒 →  4 分
    #   windows / Node 24.x      6分22秒 → 14 分（2倍）
    #   配る形で1ターン（Win）  13分02秒 → 28 分（2倍）
    # 前は「週1回 × 3分 なので、月に12分ほど」と書いてあった。
    # ubuntu の分しか数えていない。**15 倍ずれていた。**
    # 口座は 2,000 分／月で、全部のリポジトリが同じものを使う。
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: '全部の組み合わせで回す'
        type: boolean
        default: false
      real:
        description: '本物の重み（unsloth/Qwen3-0.6B-GGUF）を落として、答えの中身まで見る。これだけを回す'
        type: boolean
        default: false
      real_os:
        description: 'real を回す機械（ubuntu は 1 倍、windows は 2 倍で数える）'
        type: choice
        options: [ubuntu-latest, windows-latest]
        default: ubuntu-latest

# 同じ枝に続けて push したら、前のものは打ち切る。
# 途中の版が通ったかどうかは、結局いらない。
concurrency:
  # `real`（有料で長い）は別の組にする。同じ枝への push や週一の回で打ち切られないように。
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.real && 'real' || 'ci' }}
  cancel-in-progress: true

jobs:
  # 安い方（Linux は1倍）。**ここは押すたびに回す。**
  #
  # 回さないのは「draft で開いた」その一回だけ。押した木は push の手前のフックが手元で
  # 確かめてあり、開いてすぐ Ready にすると、この回は同じ組（concurrency）の Ready の回に
  # 打ち切られて、打ち切られるまでの分だけ課金される（run 128、2026-09-24）。
  # draft のまま押せば synchronize で回り、Ready にすれば全部回るので、見る機会は減らない。
  test:
    name: ubuntu-latest / Node 22.x
    # 本物の重みだけを頼んだ回では回さない（枠を使わない）。
    if: >-
      (github.event_name != 'workflow_dispatch' || !inputs.real)
      && !(github.event.action == 'opened' && github.event.pull_request.draft == true)
    runs-on: ubuntu-latest
    # 暴走した1本で枠を溶かさない。手元では3分ほど。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # 実行時の依存はゼロなので、ここでは何も入れない。
      # 入れてしまうと「入れなくても動く」が壊れても気づけない。
      - name: テスト
        run: npm test

      # 型チェックだけは TypeScript が要る。独立した仕事にすると
      # それだけで1分課金されるので、安い方の仕事に相乗りさせる。
      - name: 型チェック
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

  # 配る先（Windows）。**2倍で数えられるので、draft のうちは回さない。**
  #
  # draft は「まだ見せていない」という合図で、そこへ押すたびに回すと、
  # 直しを 3 回押しただけで Windows が 3 回（15 分 → 30 分ぶん）走る。
  # 実際にこの PR で 3 回押した。**Ready にした時点で 1 回だけ回る。**
  #
  # 手で頼んだとき・週に一度は、draft でなくても回る（PR が無い回なので
  # `github.event.pull_request` が空になり、下の条件は素通りする）。
  #
  # 落ちるのはいつも Windows 側なので、**減らすのは回数だけ。**
  # 見る中身（`npm test` の全部）は減らさない。
  test-windows:
    name: windows-latest / Node 24.x
    if: >-
      (github.event_name != 'workflow_dispatch' || !inputs.real)
      && github.event.pull_request.draft != true
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: テスト
        run: npm test

  # 配る形で、配る機械（Windows）で、送って返るところまで通す。
  #
  # `docs/RETHINK.md` で決めた**完成の定義がこれ**。
  # 「組めた」「テストが通った」ではなく、**組んだものを開いて1ターン通せたか**。
  # ここまで、その確かめは linux でしかやっていなかった（`npm run check:bundle`）。
  # 配る先は Windows なので、いちばん壊れる所を見ていないことになる。
  #
  # 中でやること（`scripts/check-bundle.mjs` 一つ）:
  #   組む → その中で全部のテスト → 小さなモデルを置く → 画面を起こす
  #   → smoke（送って返る） → sweep → 止めて、止まったことまで見る
  #
  # sweep には playwright-core が要る。**配る形には入れない**
  # （実行時の依存はゼロのまま）。ブラウザは Edge を使う。Windows には必ず在る。
  # この仕事の中だけ、組んだものに playwright-core が写る。捨てる物なので構わない。
  #
  # **高い。**組んで起こすので十数分、Windows は2倍で数えられる。
  # だから PR では回さない。**手で頼んだときと、週に一度だけ。**
  bundle:
    name: bundle / Windows
    if: github.event_name != 'pull_request' && !inputs.real
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # ここで入れるものは二つ。まとめて一度に渡す
      # （`--no-save` を一つずつ渡すと、他の `--no-save` の分が消える）。
      #
      #   playwright-core   sweep（画面を押して回る）に要る。**配る形には入らない**
      #   node-llama-cpp    モデルを読む側。**配る形には入る**（setup.exe と同じ）
      #
      # 後者を入れていなかったので、組んだものにモデルを読む側が無く、
      # 送っても「読み込めませんでした」で返っていた。それでは
      # **1ターン通せたことにならない。**配る形を組む release と同じものを入れる
      # （GPU 向けの版は入れない。ランナーに GPU が無いので、CPU の版だけで足りる）。
      - name: 組むのと押すのに要るものを入れる
        run: npm i --no-save --no-audit --no-fund playwright-core node-llama-cpp @node-llama-cpp/win-x64

      - name: 配る形で1ターン
        run: npm run check:bundle

  # 本物の重みで、本当に答えるかを見る。
  #
  # ここまでの確かめは全部、乱数の重みの模型で「道が繋がっている」ことを見ていた。
  # **答えの中身は一度も見ていない。**配った先で毎回そこで壊れた。
  # 開発している場所からは配布元（huggingface）へ繋がらないので、外へ出られる
  # ここでだけ確かめられる。
  #
  # 中でやること（`scripts/check-real.mjs` 一つ）:
  #   配る形に組む → 製品の道で GGUF を取ってくる（約 400MB）→ その中で
  #   「1+1= に 2」と「read_file を呼んで読んだマーカーを答える」を厳しく見る
  #
  # 手で頼んだときだけ（`real`）。既定は ubuntu（1 倍）。配る先で見たいときは
  # windows（2 倍）。この回では他の仕事を回さない。
  real:
    name: real model / ${{ inputs.real_os || 'ubuntu-latest' }}
    if: github.event_name == 'workflow_dispatch' && inputs.real
    # 手で頼んだとき以外は空になる。if で飛ぶが、空のまま渡さない。
    runs-on: ${{ inputs.real_os || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # モデルを読む側。配る形（setup.exe）と同じ入れ方。名指しは CPU の版だが、
      # npm は node-llama-cpp の optional（cuda・vulkan、合わせて 600MB ほど）も入れる。
      # GPU の無いランナーでは CPU へ落ちる（Windows の bundle で通っている道）。
      - name: モデルを読む側を入れる（Windows）
        if: runner.os == 'Windows'
        run: npm i --no-save --no-audit --no-fund node-llama-cpp @node-llama-cpp/win-x64

      - name: モデルを読む側を入れる（Linux）
        if: runner.os == 'Linux'
        run: npm i --no-save --no-audit --no-fund node-llama-cpp @node-llama-cpp/linux-x64

      - name: 本物の重みで1ターン
        run: node scripts/check-real.mjs

  # 手で頼んだときだけ、残りの組み合わせも見る。
  full:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} (full)
    if: inputs.full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '24.x' }
          - { os: windows-latest, node: '22.x' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
