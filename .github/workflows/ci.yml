# 検査を回す。
#
# Windows を入れているのが要点。
# 「Linux では通るが Windows では落ちる」が実際に起きており
# （殻の glob 展開、巨大な仮ファイル、パスの区切り、実行ビット）、
# 手元が Windows でも、直す側が Linux なら気づけない。
#
# ただし **Windows の枠は2倍で数えられる**。前に使い切って
# 1日まるごと検査できなくなった。
#
# **push では回さない。** ここが一番効く。
# 直しを10回押せば10回回る、という作りだったのが元凶で、
# 1回あたりを安くしても、回数が減らなければ意味がない。
#
# 代わりに、回すのは次の三つだけ。
#
#   PR を出したとき   人に見せる前。ここが本来の検査の場
#   手で頼んだとき    確かめたいときに、確かめたいものを
#   週に一度          網。手元では気づけない環境側の変化を拾う
#                     （ランナーの中身や Node の更新で、こちらを
#                       変えていなくても落ちることがある）
#
# main へ直接押す運用では、押す前に手元で npm test を通す。
# 手元と CI で違いが出るのは Windows なので、そこが気になる変更のときは
# PR を出すか、手で回す。
#
# 1回あたりも減らしてある。
#   ・後から押したら、走っている前のものは打ち切る
#   ・組み合わせは2つだけ（下限の Node は Linux、Windows は現行の Node）
#   ・型検査は独立した仕事にしない（仕事を1つ増やすと、それだけで1分課金される）
#   ・文書だけの変更では回さない
name: 検査

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore', '.gitattributes']
  schedule:
    # 毎週月曜 09:00 JST。UTC では月曜 00:00。
    # （JST の何時かを先に決めてから UTC へ直す。逆をやると1日ずれる）
    # 週1回 × 3分 なので、月に12分ほど。
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: '全部の組み合わせで回す'
        type: boolean
        default: false
      real:
        description: '本物の重み（unsloth/Qwen3-0.6B-GGUF）を落として、答えの中身まで見る。これだけを回す'
        type: boolean
        default: false
      real_os:
        description: 'real を回す機械（ubuntu は 1 倍、windows は 2 倍で数える）'
        type: choice
        options: [ubuntu-latest, windows-latest]
        default: ubuntu-latest

# 同じ枝に続けて push したら、前のものは打ち切る。
# 途中の版が通ったかどうかは、結局いらない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    # 本物の重みだけを頼んだ回では回さない（枠を使わない）。
    if: github.event_name != 'workflow_dispatch' || !inputs.real
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 既定は2つ。下限の Node が Linux（安い方）で、
        # Windows は実際に使う版で見る。落ちるのはいつも Windows 側なので、
        # 減らすならこちらではなく Linux 側から減らす。
        os: [ubuntu-latest, windows-latest]
        node: ['22.x']
        include:
          - os: windows-latest
            node: '24.x'
        exclude:
          - os: windows-latest
            node: '22.x'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 実行時の依存はゼロなので、ここでは何も入れない。
      # 入れてしまうと「入れなくても動く」が壊れても気づけない。
      - name: 検査
        run: npm test

      # 型検査だけは TypeScript が要る。独立した仕事にすると
      # それだけで1分課金されるので、安い方の仕事に相乗りさせる。
      - name: 型検査
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

  # 配る形で、配る機械（Windows）で、送って返るところまで通す。
  #
  # `docs/RETHINK.md` で決めた**完成の定義がこれ**。
  # 「組めた」「テストが通った」ではなく、**組んだものを開いて1ターン通せたか**。
  # ここまで、その確かめは linux でしかやっていなかった（`npm run check:bundle`）。
  # 配る先は Windows なので、いちばん壊れる所を見ていないことになる。
  #
  # 中でやること（`scripts/check-bundle.mjs` 一つ）:
  #   組む → その中で全部のテスト → 小さなモデルを置く → 画面を起こす
  #   → smoke（送って返る） → sweep → 止めて、止まったことまで見る
  #
  # sweep には playwright-core が要る。**配る形には入れない**
  # （実行時の依存はゼロのまま）。ブラウザは Edge を使う。Windows には必ず在る。
  # この仕事の中だけ、組んだものに playwright-core が写る。捨てる物なので構わない。
  #
  # **高い。**組んで起こすので十数分、Windows は2倍で数えられる。
  # だから PR では回さない。**手で頼んだときと、週に一度だけ。**
  bundle:
    name: 配る形で1ターン（Windows）
    if: github.event_name != 'pull_request' && !inputs.real
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # ここで入れるものは二つ。まとめて一度に渡す
      # （`--no-save` を一つずつ渡すと、他の `--no-save` の分が消える）。
      #
      #   playwright-core   sweep（画面を押して回る）に要る。**配る形には入らない**
      #   node-llama-cpp    モデルを読む側。**配る形には入る**（setup.exe と同じ）
      #
      # 後者を入れていなかったので、組んだものにモデルを読む側が無く、
      # 送っても「読み込めませんでした」で返っていた。それでは
      # **1ターン通せたことにならない。**配る形を組む release と同じものを入れる
      # （GPU 向けの版は入れない。ランナーに GPU が無いので、CPU の版だけで足りる）。
      - name: 組むのと押すのに要るものを入れる
        run: npm i --no-save --no-audit --no-fund playwright-core node-llama-cpp @node-llama-cpp/win-x64

      - name: 配る形で1ターン
        run: npm run check:bundle

  # 本物の重みで、本当に答えるかを見る。
  #
  # ここまでの確かめは全部、乱数の重みの模型で「道が繋がっている」ことを見ていた。
  # **答えの中身は一度も見ていない。**配った先で毎回そこで壊れた。
  # 開発している場所からは配布元（huggingface）へ繋がらないので、外へ出られる
  # ここでだけ確かめられる。
  #
  # 中でやること（`scripts/check-real.mjs` 一つ）:
  #   配る形に組む → 製品の道で GGUF を取ってくる（約 400MB）→ その中で
  #   「1+1= に 2」と「read_file を呼んで読んだマーカーを答える」を厳しく見る
  #
  # 手で頼んだときだけ（`real`）。既定は ubuntu（1 倍）。配る先で見たいときは
  # windows（2 倍）。この回では他の仕事を回さない。
  real:
    name: 本物の重みで1ターン（${{ inputs.real_os }}）
    if: github.event_name == 'workflow_dispatch' && inputs.real
    runs-on: ${{ inputs.real_os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # モデルを読む側。配る形（setup.exe）と同じもの。GPU 向けの版は入れない。
      - name: モデルを読む側を入れる（Windows）
        if: runner.os == 'Windows'
        run: npm i --no-save --no-audit --no-fund node-llama-cpp @node-llama-cpp/win-x64

      - name: モデルを読む側を入れる（Linux）
        if: runner.os == 'Linux'
        run: npm i --no-save --no-audit --no-fund node-llama-cpp @node-llama-cpp/linux-x64

      - name: 本物の重みで1ターン
        run: node scripts/check-real.mjs

  # 手で頼んだときだけ、残りの組み合わせも見る。
  full:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}（全部）
    if: inputs.full
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '24.x' }
          - { os: windows-latest, node: '22.x' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
