# portable / setup.exe を組み立てる。
#
# **押すたびには回さない。**印（タグ）を付けたときと、手で頼んだときだけ。
#
# 仕事を二つに割ってある。**portableに Windows は要らない。**
# bundle.mjs は置くだけの仕事で、node.exe も落としてきて写すだけなので、
# Linux で組める（枠は1倍）。Windows が要るのは NSIS で setup.exe を
# 組むときだけなので、そちらはタグのときだけ回す。
#
# 前は全部を Windows で組んでいた。2倍の枠を、要らない仕事にも払っていた。
name: build

on:
  push:
    tags: ['v*']
    # 印（タグ）と同じ意味の枝。この作業場からはタグを押せない（中継が黙って落とす。
    # 実測）ので、release/v0.1.0 の枝を押すと、v0.1.0 の印を付けたのと同じに扱う。
    # 印そのものは公開のときに GitHub 側で付く。
    branches: ['release/v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Releases へ置くので、書き込みが要る（既定は読むだけ）。
# 無いと組み立ては通るのに、最後の公開だけが 403 で落ちる。
permissions:
  contents: write

env:
  # 同梱する Node。型を剥がしながら実行するので v22.6 以降。
  NODEVER: v24.18.0

jobs:
  # ------------------------------------------------------------------
  # portable。Node ごと入っているので、置くだけで動く。
  # 何もインストールせずに使う。
  # ------------------------------------------------------------------
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 版を決める
        id: v
        run: |
          # tag=v0.1.0 なら正式版。空なら main の最新（portable という印に置く）。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME#release/}" != "${GITHUB_REF_NAME}" ]; then
            TAG="${GITHUB_REF_NAME#release/}"
          else
            TAG=""
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "${TAG}" ]; then
            echo "id=${TAG#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "id=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # 型検査に要るものだけ入れる。持ち運び先でも検査を回せるように同梱する。
      - run: npm ci --no-audit --no-fund

      # モデルを中で読むためのライブラリ。**実行ファイルは増えない**
      # （中身は .dll と .node だけ）。二つ目の実行ファイルを置けない
      # 機械では、これだけが道になる。
      #
      # 配る相手は決まっているので、その分だけ入れる。
      - name: モデルを読むライブラリを入れる（win-x64 の CPU・CUDA・Vulkan の分）
        run: |
          # **一度に入れる。**二回に分けると、二回目が一回目の分を刈り取る
          # （--no-save は package.json に残らないので「要らないもの」に見える）。
          # 実際にそうなり、本体の無い配布物を配った。
          #
          # --omit=optional  全機械むけの binary を持ってこない（付けないと
          #                  CUDA 版・mac 版・arm 版まで来て 1.1GB になる。
          #                  --os / --cpu は効かない。試した）
          # --force          組み立てているのは Linux、入れる先は Windows
          # --ignore-scripts postinstall が llama.cpp を取ってきて手元で組む
          #                  （+292MB。Linux むけなので配る相手には要らない）
          # @modelcontextprotocol/server-github も一緒に。
          # npx は npm に付いてくるが、入れる版には node しか入らない。
          # 入れておかないと「GitHub と繋ぐ」は口があるだけで一度も繋がらない。
          #
          # **GPU 用の binary（cuda・vulkan）も入れる。**CPU の分だけだった間、
          # RTX の機械でも CPU で回り、記憶を使い切って答えなかった。
          # 大きさは cuda 171MB・vulkan 99MB（展開後）。.exe は一つも増えない。
          # 読む側は cuda → vulkan → CPU の順に動くものを使う（src/runtime/inproc.ts）。
          npm install --no-save --no-audit --no-fund \
            --omit=optional --force --ignore-scripts \
            node-llama-cpp @node-llama-cpp/win-x64 \
            @node-llama-cpp/win-x64-cuda @node-llama-cpp/win-x64-vulkan \
            @modelcontextprotocol/server-github
          # 在るかどうかだけ見ない。**本体と binary の両方**を見る。
          test -f node_modules/node-llama-cpp/dist/index.js
          test -f node_modules/@node-llama-cpp/win-x64/bins/win-x64/llama-addon.node
          test -f node_modules/@node-llama-cpp/win-x64-cuda/bins/win-x64-cuda/ggml-cuda.dll
          test -f node_modules/@node-llama-cpp/win-x64-vulkan/bins/win-x64-vulkan/ggml-vulkan.dll
          # 実行ファイルが増えないことが、この道の要点。0個であることを見る。
          test "$(find node_modules/@node-llama-cpp -name '*.exe' | wc -l)" -eq 0
          # llama/ は llama.cpp の元（34MB）。ただし **JSON だけは import 時に読む**。
          # 丸ごと消したら import できない配布物を出してしまった（実測）。
          find node_modules/node-llama-cpp/llama -type f ! -name '*.json' -delete
          find node_modules/node-llama-cpp/llama -type d -empty -delete
          test -f node_modules/node-llama-cpp/llama/binariesGithubRelease.json
          # 在るだけでなく、**読み込めること**を見る。ここで落ちた版を配った。
          node -e "import('node-llama-cpp').then(() => console.log('import ok'))"
          test -f node_modules/@modelcontextprotocol/server-github/dist/index.js
          du -sh node_modules

      # ライブラリを入れた状態で検査を回す。作業コピーには入っていないので、
      # **ここでしか確かめられないもの**がある（呼んでいる形が本物にあるか）。
      - name: 検査を回す
        run: node scripts/run-tests.mjs

      - name: Windows 用の Node を取ってくる（同梱する中身）
        run: curl -fL --retry 3 -o node.exe "https://nodejs.org/dist/${NODEVER}/win-x64/node.exe"

      - name: 組み立てる
        run: node scripts/bundle.mjs --out dist/AdaptiveAIStudio --node-exe node.exe --version "${{ steps.v.outputs.id }}"

      - name: 確かめる（同梱した形のまま）
        run: |
          # 在るかどうかだけ見ない。空でも0バイトでも通ってしまう。
          # 実際に test -f だけで通していて、利用者の手元に node.exe が
          # 無いことに気づけなかった。
          SIZE=$(stat -c%s dist/AdaptiveAIStudio/runtime/node.exe)
          echo "runtime/node.exe = ${SIZE} bytes"
          test "$SIZE" -gt 40000000
          # 本物の Windows 実行ファイルか（MZ で始まる）。
          head -c2 dist/AdaptiveAIStudio/runtime/node.exe | grep -q MZ
          test -f dist/AdaptiveAIStudio/AdaptiveAIStudio.cmd
          test -f dist/AdaptiveAIStudio/app/start.cmd
          # モデルを読むライブラリ。本体が無いと、binary だけ入って動かない。
          test -f dist/AdaptiveAIStudio/app/node_modules/node-llama-cpp/dist/index.js
          test -f dist/AdaptiveAIStudio/app/node_modules/@node-llama-cpp/win-x64/bins/win-x64/llama-addon.node
          test -f dist/AdaptiveAIStudio/app/node_modules/@node-llama-cpp/win-x64-cuda/bins/win-x64-cuda/llama-addon.node
          test -f dist/AdaptiveAIStudio/app/node_modules/@node-llama-cpp/win-x64-vulkan/bins/win-x64-vulkan/llama-addon.node
          # バッチが CP932 のまま入っているか。UTF-8 だと cmd.exe が行を壊す。
          ! iconv -f UTF-8 -t UTF-8 dist/AdaptiveAIStudio/app/start.cmd > /dev/null 2>&1

      - name: まとめたものを、開いて確かめる
        run: |
          cd dist && zip -qr ../AdaptiveAIStudio-portable.zip AdaptiveAIStudio && cd ..
          # ZIP から取り出し直して見る。**まとめる前ではなく、後を見る。**
          rm -rf verify && mkdir verify && unzip -q AdaptiveAIStudio-portable.zip -d verify
          ls -l verify/AdaptiveAIStudio/runtime/
          SIZE=$(stat -c%s verify/AdaptiveAIStudio/runtime/node.exe)
          echo "ZIP の中の runtime/node.exe = ${SIZE} bytes"
          test "$SIZE" -gt 40000000
          test -f verify/AdaptiveAIStudio/app/node_modules/node-llama-cpp/dist/index.js
          test -f verify/AdaptiveAIStudio/app/node_modules/@node-llama-cpp/win-x64/bins/win-x64/llama-addon.node
          test -f verify/AdaptiveAIStudio/app/node_modules/@node-llama-cpp/win-x64-cuda/bins/win-x64-cuda/llama-addon.node
          test -f verify/AdaptiveAIStudio/app/node_modules/@node-llama-cpp/win-x64-vulkan/bins/win-x64-vulkan/llama-addon.node
          echo "ZIP の中のライブラリ: あり"
          ls -l AdaptiveAIStudio-portable.zip

      # **ここで「組んだものの中でテストを回す」ことはできない。**
      #
      # 手元で回して 17 件落ちたので、同じことを CI でもやろうとして
      # `../runtime/node scripts/run-tests.mjs` を足した。**動かない。**
      # ここで組んでいるのは Windows むけで、中に入っているのは
      # `runtime/node.exe`。ubuntu の runner では、名前も違えば実行もできない。
      # 足した本人が、その仕事が何を組んでいるかを見ていなかった。
      #
      # 手元で確かめるときは `--node-here` で組めば、その中で回せる
      # （`npm run bundle -- --out ... --node-here`）。

      # artifact には上げない。Releases に置くものと同じ写しを 30 日残していて、
      # どの job も download していなかった。Actions の storage（0.5GB）を
      # それだけで使い切った（39 個・2.8GB）。置く先は Releases の一つだけ。
      - name: 公開する
        uses: softprops/action-gh-release@v2
        with:
          # タグが無いときも、動く現物を置いておく。落とせないものを
          # 「同梱してあります」と言わないための場所。
          tag_name: ${{ steps.v.outputs.tag || 'portable' }}
          name: ${{ steps.v.outputs.tag || 'portable (main)' }}
          prerelease: ${{ steps.v.outputs.tag == '' }}
          target_commitish: ${{ github.sha }}
          files: |
            AdaptiveAIStudio-portable.zip

  # ------------------------------------------------------------------
  # インストーラ。**Linux で組む。**
  #
  # ここまで「NSIS は Windows でしか動かない」と思い込んで windows-2022 で
  # 組んでいた。枠は2倍で数えられる。実際には makensis は Linux にもあり
  # （apt の nsis）、同じ .nsi から同じ setup.exe が出る（手元で確かめた）。
  # 枠は半分になる。手元では `npm run installer` で、枠を一度も払わずに組める。
  # ------------------------------------------------------------------
  installer:
    if: github.ref_type == 'tag' || startsWith(github.ref_name, 'release/v')
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: NSIS を入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 版を決める
        id: v
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "id=${TAG#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund

      # portable と同じものを入れる。ここを抜かすと **setup.exe だけ
      # モデルを中で読めない**、という食い違いになる。
      - name: モデルを読むライブラリを入れる（win-x64 の CPU・CUDA・Vulkan の分）
        run: |
          # 一度に入れる（二回に分けると二回目が一回目を刈り取る）。portable と同じ三つ。
          # @modelcontextprotocol/server-github も一緒に。
          # npx は npm に付いてくるが、入れる版には node しか入らない。
          # 入れておかないと「GitHub と繋ぐ」は口があるだけで一度も繋がらない。
          npm install --no-save --no-audit --no-fund \
            --omit=optional --force --ignore-scripts \
            node-llama-cpp @node-llama-cpp/win-x64 \
            @node-llama-cpp/win-x64-cuda @node-llama-cpp/win-x64-vulkan \
            @modelcontextprotocol/server-github
          test -f node_modules/node-llama-cpp/dist/index.js
          test -f node_modules/@node-llama-cpp/win-x64/bins/win-x64/llama-addon.node
          test -f node_modules/@node-llama-cpp/win-x64-cuda/bins/win-x64-cuda/ggml-cuda.dll
          test -f node_modules/@node-llama-cpp/win-x64-vulkan/bins/win-x64-vulkan/ggml-vulkan.dll
          test "$(find node_modules/@node-llama-cpp -name '*.exe' | wc -l)" -eq 0
          find node_modules/node-llama-cpp/llama -type f ! -name '*.json' -delete
          find node_modules/node-llama-cpp/llama -type d -empty -delete
          test -f node_modules/node-llama-cpp/llama/binariesGithubRelease.json
          node -e "import('node-llama-cpp').then(() => console.log('import ok'))"
          test -f node_modules/@modelcontextprotocol/server-github/dist/index.js

      - name: Node を取ってくる（同梱用）
        run: curl -fL --retry 3 -o node.exe "https://nodejs.org/dist/${NODEVER}/win-x64/node.exe"

      - name: 組み立てる
        run: node scripts/bundle.mjs --out installer/payload --node-exe node.exe --version "${{ steps.v.outputs.id }}"

      - name: インストーラ（setup.exe）
        run: |
          # 持ち運びの目印は、入れる版には要らない。
          # 残すと、入れたのに data\ を自分の隣（Program Files）に作ってしまう。
          rm -f installer/payload/.portable
          # **`-D` で渡す。**Linux の makensis は `/VERSION` のような `/` 始まりを
          # 「そういう名前のファイル」として読みに行く。
          makensis -DVERSION=${{ steps.v.outputs.id }} installer/AdaptiveAIStudio.nsi
          # 在るかどうかだけ見ない。組んだ後を開いて、入っているものを見る。
          sudo apt-get install -y -qq p7zip-full
          7z x -ox installer/AdaptiveAIStudio-Setup.exe > /dev/null
          test "$(stat -c%s x/runtime/node.exe)" -gt 40000000
          test -f x/app/node_modules/node-llama-cpp/dist/index.js
          test -f x/app/node_modules/@node-llama-cpp/win-x64/bins/win-x64/llama-addon.node
          test -f x/app/node_modules/@node-llama-cpp/win-x64-cuda/bins/win-x64-cuda/llama-addon.node
          test -f x/app/node_modules/@node-llama-cpp/win-x64-vulkan/bins/win-x64-vulkan/llama-addon.node
          test ! -f x/.portable
          ls -l installer/AdaptiveAIStudio-Setup.exe

      # artifact には上げない（上と同じ理由）。
      - name: 公開する
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: installer/AdaptiveAIStudio-Setup.exe
