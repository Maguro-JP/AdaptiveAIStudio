# portable / setup.exe を組み立てる。
#
# **押すたびには回さない。**印（タグ）を付けたときと、手で頼んだときだけ。
#
# 仕事を二つに割ってある。**portableに Windows は要らない。**
# bundle.mjs は置くだけの仕事で、node.exe も落としてきて写すだけなので、
# Linux で組める（枠は1倍）。Windows が要るのは NSIS で setup.exe を
# 組むときだけなので、そちらはタグのときだけ回す。
#
# 前は全部を Windows で組んでいた。2倍の枠を、要らない仕事にも払っていた。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Releases へ置くので、書き込みが要る（既定は読むだけ）。
# 無いと組み立ては通るのに、最後の公開だけが 403 で落ちる。
permissions:
  contents: write

env:
  # 同梱する Node。型を剥がしながら実行するので v22.6 以降。
  NODEVER: v24.18.0

jobs:
  # ------------------------------------------------------------------
  # portable。Node ごと入っているので、置くだけで動く。
  # 何も入れられない機械（会社の PC など）で使う。
  # ------------------------------------------------------------------
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 版を決める
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "id=${GITHUB_REF_NAME#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "id=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # 型検査に要るものだけ入れる。持ち運び先でも検査を回せるように同梱する。
      - run: npm ci --no-audit --no-fund

      # モデルを中で読むためのライブラリ。**実行ファイルは増えない**
      # （中身は .dll と .node だけ）。二つ目の実行ファイルを置けない
      # 機械では、これだけが道になる。
      #
      # 配る相手は決まっているので、その分だけ入れる。
      - name: モデルを読むライブラリを入れる（win-x64 の分だけ）
        run: |
          # --omit=optional で、全機械むけの binary を持ってこない。
          # そのまま叩くと CUDA 版・mac 版・arm 版まで来て 1.1GB になる
          # （--os / --cpu は効かなかった。試した）。
          # --ignore-scripts が要る。付けないと postinstall が llama.cpp の
          # ソースを取ってきて手元で組み、292MB 増える（Linux むけの物なので
          # 配る相手には要らない）。
          npm install --no-save --no-audit --no-fund --omit=optional \
            --ignore-scripts node-llama-cpp
          # 配る相手の分だけ、名指しで入れる。組み立てているのは Linux
          # なので、--force が要る（入れる先が Windows のため）。
          npm install --no-save --no-audit --no-fund --omit=optional --force \
            --ignore-scripts @node-llama-cpp/win-x64
          ls node_modules/@node-llama-cpp
          test -d node_modules/@node-llama-cpp/win-x64
          # 実行ファイルが増えないことが、この道の要点。0個であることを見る。
          test "$(find node_modules/@node-llama-cpp -name '*.exe' | wc -l)" -eq 0
          # 組んだ跡が残っていたら落とす（Linux むけなので配らない）。
          rm -rf node_modules/node-llama-cpp/llama
          du -sh node_modules

      - name: Windows 用の Node を取ってくる（同梱する中身）
        run: curl -fL --retry 3 -o node.exe "https://nodejs.org/dist/${NODEVER}/win-x64/node.exe"

      - name: 組み立てる
        run: node scripts/bundle.mjs --out dist/AdaptiveAIStudio --node-exe node.exe --version "${{ steps.v.outputs.id }}"

      - name: 確かめる（同梱した形のまま）
        run: |
          # 在るかどうかだけ見ない。空でも0バイトでも通ってしまう。
          # 実際に test -f だけで通していて、利用者の手元に node.exe が
          # 無いことに気づけなかった。
          SIZE=$(stat -c%s dist/AdaptiveAIStudio/runtime/node.exe)
          echo "runtime/node.exe = ${SIZE} bytes"
          test "$SIZE" -gt 40000000
          # 本物の Windows 実行ファイルか（MZ で始まる）。
          head -c2 dist/AdaptiveAIStudio/runtime/node.exe | grep -q MZ
          test -f dist/AdaptiveAIStudio/AdaptiveAIStudio.cmd
          test -f dist/AdaptiveAIStudio/app/start.cmd
          # バッチが CP932 のまま入っているか。UTF-8 だと cmd.exe が行を壊す。
          ! iconv -f UTF-8 -t UTF-8 dist/AdaptiveAIStudio/app/start.cmd > /dev/null 2>&1

      - name: まとめたものを、開いて確かめる
        run: |
          cd dist && zip -qr ../AdaptiveAIStudio-portable.zip AdaptiveAIStudio && cd ..
          # ZIP から取り出し直して見る。**まとめる前ではなく、後を見る。**
          rm -rf verify && mkdir verify && unzip -q AdaptiveAIStudio-portable.zip -d verify
          ls -l verify/AdaptiveAIStudio/runtime/
          SIZE=$(stat -c%s verify/AdaptiveAIStudio/runtime/node.exe)
          echo "ZIP の中の runtime/node.exe = ${SIZE} bytes"
          test "$SIZE" -gt 40000000

      # .exe を置けない場所（会社のクラウドドライブ）むけ。中身は同じで、
      # Node の名前だけが node.bin。名前のとおり .exe が一つも入らない。
      - name: .exe を含まない版も作る
        run: |
          node scripts/bundle.mjs --out dist2/AdaptiveAIStudio --node-exe node.exe \
            --node-name node.bin --version "${{ steps.v.outputs.id }}"
          SIZE=$(stat -c%s dist2/AdaptiveAIStudio/runtime/node.bin)
          echo "runtime/node.bin = ${SIZE} bytes"
          test "$SIZE" -gt 40000000
          cd dist2 && zip -qr ../AdaptiveAIStudio-portable-noexe.zip AdaptiveAIStudio && cd ..
          rm -rf verify2 && mkdir verify2
          unzip -q AdaptiveAIStudio-portable-noexe.zip -d verify2
          test "$(stat -c%s verify2/AdaptiveAIStudio/runtime/node.bin)" -gt 40000000

      - uses: actions/upload-artifact@v4
        with:
          name: AdaptiveAIStudio-portable-${{ steps.v.outputs.id }}
          path: |
            AdaptiveAIStudio-portable.zip
            AdaptiveAIStudio-portable-noexe.zip
          retention-days: 30

      - name: 公開する
        uses: softprops/action-gh-release@v2
        with:
          # タグが無いときも、動く現物を置いておく。落とせないものを
          # 「同梱してあります」と言わないための場所。
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'portable' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'portable (main)' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            AdaptiveAIStudio-portable.zip
            AdaptiveAIStudio-portable-noexe.zip

  # ------------------------------------------------------------------
  # インストーラ。NSIS が要るので Windows でしか組めない（枠は2倍）。
  # だからタグのときだけ。
  # ------------------------------------------------------------------
  installer:
    if: github.ref_type == 'tag'
    needs: portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 版を決める
        id: v
        shell: bash
        run: echo "id=${GITHUB_REF_NAME#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund

      - name: Node を取ってくる（同梱用）
        shell: bash
        run: curl -fL --retry 3 -o node.exe "https://nodejs.org/dist/${NODEVER}/win-x64/node.exe"

      - name: 組み立てる
        run: node scripts/bundle.mjs --out installer/payload --node-exe node.exe --version "${{ steps.v.outputs.id }}"

      - name: インストーラ（setup.exe）
        shell: cmd
        run: |
          rem 持ち運びの目印は、入れる版には要らない。
          rem 残すと、入れたのに data\ を自分の隣に作ってしまう。
          del installer\payload\.portable
          makensis /DVERSION=${{ steps.v.outputs.id }} installer\AdaptiveAIStudio.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: AdaptiveAIStudio-setup-${{ steps.v.outputs.id }}
          path: installer/AdaptiveAIStudio-Setup.exe
          retention-days: 30

      - name: 公開する
        uses: softprops/action-gh-release@v2
        with:
          files: installer/AdaptiveAIStudio-Setup.exe
