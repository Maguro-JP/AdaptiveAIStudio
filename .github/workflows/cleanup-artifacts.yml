# 溜まった artifact を消す。手で頼んだときだけ。
#
# release.yml が bundle と setup.exe の写しを artifact に 30 日残していて、
# Actions の storage（0.5GB）を使い切った。今は上げていないが、残っている分は
# 期限（30 日）まで消えない。この作業場のトークンでは消せない（403）ので、
# ここから消す。既定は数えて見せるだけ。消すのは dry_run を外したときだけで、
# 消した数と大きさを必ず言う。
name: cleanup-artifacts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '見せるだけ（true）／消す（false）'
        type: boolean
        default: true

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const dry = ${{ inputs.dry_run }};
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            let bytes = 0;
            for (const a of all) {
              bytes += a.size_in_bytes;
              core.info(`${(a.size_in_bytes / 1e6).toFixed(1)}MB  ${a.name}  ${a.created_at}`);
              if (!dry) await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
            }
            core.notice(`${dry ? '見せるだけ' : '消しました'}: ${all.length} 個・${(bytes / 1e6).toFixed(0)}MB`);
