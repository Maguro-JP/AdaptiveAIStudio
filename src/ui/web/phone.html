<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AAS">
<title>AdaptiveAIStudio</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/phone.css">
</head>
<body>
  <!-- パスフレーズ。QR から開いたときは入っていて、押さずに繋がる -->
  <main id="pairView" class="pair" hidden>
    <img src="/icon-192.png" alt="" class="logo" width="72" height="72">
    <h1>PC の AdaptiveAIStudio に繋ぐ</h1>
    <p class="hint">PC の「設定 → スマホ」に出ているパスフレーズを入れてください。QR を読んで開いたときは、入れなくても繋がります。</p>
    <form id="pairForm">
      <label for="pass">パスフレーズ</label>
      <input id="pass" name="pass" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx" required>
      <button id="pairGo" type="submit" class="big">繋ぐ</button>
      <p id="pairNote" class="note" role="status" aria-live="polite"></p>
    </form>
  </main>

  <main id="chatView" class="chat" hidden>
    <header class="top">
      <span class="brand">AdaptiveAIStudio</span>
      <span id="state" class="state" role="status">つながっています</span>
      <button id="newChat" type="button" class="ghost" title="新しい会話を始める">＋ 新しい会話</button>
    </header>
    <section id="log" class="log" aria-live="polite">
      <p class="empty" id="empty">作ってほしいもの・聞きたいことを下に書いて「送る」を押してください。答えは PC の本体が返します。</p>
    </section>
    <div id="approvals" class="approvals"></div>
    <form id="sendForm" class="composer">
      <textarea id="ask" rows="2" placeholder="例: 1〜15 の FizzBuzz を fizzbuzz.js に作って" aria-label="頼むこと"></textarea>
      <button id="sendGo" type="submit" class="big">送る</button>
    </form>
  </main>
  <script type="module" src="/phone.js"></script>
</body>
</html>
