<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdaptiveAIStudio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>▣</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <span class="brand">AdaptiveAIStudio</span>
    <span class="spacer"></span>
    <select id="themes" title="見た目を選ぶ"></select>
    <select id="presets" title="配置を選ぶ"></select>
    <button id="edit" class="ghost" title="配置を直接いじる">配置</button>
    <button id="editTheme" class="ghost" title="色をいじる">色</button>
    <span id="status" class="status">つないでいます…</span>
  </header>

  <main id="root" class="root"></main>

  <dialog id="themeEditor">
    <form method="dialog">
      <h2>色と間合い</h2>
      <p class="hint">
        触っているそばから画面に映ります。土台を選んで、気になるところだけ変えてください。
        色として読めない書き方は受け取りません。
      </p>
      <div id="swatches" class="swatches"></div>
      <p id="themeRepairs" class="repairs"></p>
      <menu>
        <button value="cancel">戻す</button>
        <button value="save" class="primary">保存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="editor">
    <form method="dialog">
      <h2>配置</h2>
      <p class="hint">
        これがこの画面の全てです。書き換えれば配置が変わります。
        壊れた形で保存しても、直して表示します。
      </p>
      <textarea id="json" spellcheck="false"></textarea>
      <p id="repairs" class="repairs"></p>
      <menu>
        <button value="cancel">やめる</button>
        <button id="apply" value="apply" class="primary">適用</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
